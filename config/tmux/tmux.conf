##### basics (yours) #####
set -g mouse on
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*:Tc"   # truecolor everywhere


##### minimal blue-grey / dot-accent status bar #####
# palette: base #2E3440, subtle #3B4252/#434C5E, fg #D8DEE9, accents #5E81AC/#81A1C1

set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=#2E3440,fg=#D8DEE9"

# LEFT: session with dot endcaps
set -g status-left-length 50
#set -g status-left "#[fg=#81A1C1]•#[fg=#D8DEE9,bg=#3B4252]  #S  #[fg=#81A1C1,bg=#2E3440]• "
#set -g status-left '#[bg=#3B4252,fg=#D8DEE9]  #[fg=#6B88A6]◈# [fg=#D8DEE9]  #S#[fg=#6B88A6]◈  #[default] '
# Session pill: double angle brackets inside a muted Nord pill
#set -g status-left '#[bg=#3B4252,fg=#D8DEE9] #[fg=#81A1C1]◈#[fg=#D8DEE9] #S #[fg=#81A1C1]◈ #[default] '
#set -g status-left '#[bg=#3B4252,fg=#D8DEE9] #[fg=#81A1C1]#[fg=#D8DEE9] #S #[fg=#81A1C1]》#[default] '
# micro-loose variant
set -g status-left '#[bg=#3B4252,fg=#D8DEE9] #[fg=#81A1C1]⟨#[fg=#D8DEE9] #S #[fg=#81A1C1]⟩ #[default] '


# WINDOWS: calm list; current gets gentle blue highlight
set -g window-status-separator " "
#set -g window-status-format " #[fg=#D8DEE9]#I:#W "
# Inactive windows: blue-grey dot caps, no fill
#set -g window-status-format ' #[fg=#6B88A6]•#[fg=#D8DEE9] #I:#W #[fg=#6B88A6]• '
set -g window-status-format ' #[fg=#6B88A6]• #[fg=#D8DEE9]#I:#W #[fg=#6B88A6]•#[default]'




#set -g window-status-current-format "#[fg=#81A1C1]•#[fg=#2E3440,bg=#81A1C1,bold]  #I:#W  #[fg=#81A1C1,bg=#2E3440]•"
#set -g window-status-current-format "#[fg=#5E81AC]・#[fg=#D8DEE9,bg=#3B4252] #I:#W #[fg=#5E81AC,bg=#2E3440]・"
#set -g window-status-current-format "#[fg=#6B88A6]•#[fg=#434C5E]│#[fg=#D8DEE9] #I:#W #[fg=#434C5E]│#[fg=#6B88A6]•"
#set -g window-status-current-format "#[fg=#5E81AC]•#[fg=#D8DEE9,bg=#3B4252]  #I:#W  #[fg=#5E81AC,bg=#2E3440]•"
#set -g window-status-current-format " #[bg=#3B4252,fg=#D8DEE9] • #I:#W • #[default] "
#set -g window-status-current-format " #[bg=#3B4252,fg=#A3BE8C] • #[fg=#D8DEE9]#I:#W#[fg=#A3BE8C] • #[default] "
#set -g window-status-current-format ' #[bg=#3B4252,fg=#A3BE8C] • #[fg=#D8DEE9]#I:#W#[fg=#A3BE8C] • #[default] '
set -g window-status-current-format ' #[bg=#3B4252,fg=#A3BE8C]• #[fg=#D8DEE9]#I:#W #[fg=#A3BE8C]•#[default]'


# Subtle activity hint
set -g window-status-activity-style "fg=#8FBCBB"


# RIGHT: clock with dot endcaps
set -g status-right-length 60
#set -g status-right " #[fg=#5E81AC]•#[fg=#D8DEE9,bg=#3B4252]  %Y-%m-%d %H:%M  #[fg=#5E81AC,bg=#2E3440]• "
##suitable for low-power systems
#set -g status-right '#[bg=#3B4252,fg=#D8DEE9] • %B %e %I:%M %p • #[default]'
##maybe not so suitable for low-power systems
#set -g status-right '#[bg=#3B4252,fg=#D8DEE9] • %B %e %I:%M %p • #[default]'
# refresh every 30s so the clock stays current without spawning too often
set -g status-interval 30

# Right side: pill with quadrant clock by time-of-day + full month + 12h time + lowercase am/pm
#set -g status-right ' #[bg=#3B4252,fg=#D8DEE9] • #(h=$(date +%H); 
#  if   [ "$h" -lt 6  ]; then printf "◷"; 
#  elif [ "$h" -lt 12 ]; then printf "◴"; 
#  elif [ "$h" -lt 18 ]; then printf "◶"; 
#else                       printf "◵"; 
#  fi) %B %e, %Y %I:%M %P • #[default] '


set -g status-right ' #[bg=#3B4252,fg=#D8DEE9] #(h=$(date +%H); sym=◴; \
  if [ "$h" -lt 3 ]; then sym=◷; fi; \
  if [ "$h" -ge 12 ] && [ "$h" -lt 15 ]; then sym=◷; fi; \
  if [ "$h" -ge 3 ] && [ "$h" -lt 6 ]; then sym=◶; fi; \
  if [ "$h" -ge 15 ] && [ "$h" -lt 18 ]; then sym=◶; fi; \
  if [ "$h" -ge 6 ] && [ "$h" -lt 9 ]; then sym=◵; fi; \
  if [ "$h" -ge 18 ] && [ "$h" -lt 21 ]; then sym=◵; fi; \
  if [ "$h" -ge 9 ] && [ "$h" -lt 12 ]; then sym=◴; fi; \
  if [ "$h" -ge 21 ]; then sym=◴; fi; \
  d=$(date "+%%I:%%M%%P %%B %%e"); printf "%%s %%s" "$sym" "$d") #[default]'

# Messages / copy-mode to match
set -g message-style "bg=#3B4252,fg=#D8DEE9"
set -g message-command-style "bg=#3B4252,fg=#D8DEE9"
set -g mode-style "bg=#434C5E,fg=#D8DEE9"

